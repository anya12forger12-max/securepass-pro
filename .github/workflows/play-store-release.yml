name: Play Store Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret."
          else
            echo "GOOGLE_SERVICES_JSON secret not set; using committed google-services.json."
          fi

      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          fi

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/my-release-key.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=my-release-key.jks\n' \
              "$STORE_PASS" "$KEY_PASS" "$KEY_ALIAS" > android/key.properties
            echo "Release signing configured."
          else
            echo "RELEASE_KEYSTORE_B64 not set; falling back to debug signing."
          fi

      - name: Build Android Release Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-number=${{ github.run_number }}

      - name: Build Android Release APK
        run: |
          flutter build apk \
            --release \
            --build-number=${{ github.run_number }}

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

      # Play upload needs a Play service account secret AND an upload key that
      # matches the Play Console app. CI has no keystore, so the AAB is
      # debug-signed and this step may legitimately fail — the Android
      # artifacts above are the reliable deliverable. Never fail the build.
      - name: Upload to Google Play
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT }}
          packageName: com.securepass.securepass_pro
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  build-ios:
    continue-on-error: true
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode GoogleService-Info.plist
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST" ]; then
            echo "$PLIST" > ios/Runner/GoogleService-Info.plist
            echo "Wrote GoogleService-Info.plist from secret."
          else
            echo "GOOGLE_SERVICE_INFO_PLIST secret not set; using committed plist (if any)."
          fi

      - name: Build iOS
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Upload to TestFlight
        continue-on-error: true
        uses: Apple-Actions/upload-testflight-build@v1
        with:
          app-path: 'build/ios/iphoneos/Runner.app'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to publish a release whose version would lie
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -m1 '^version:' pubspec.yaml | sed -E "s/^version:[[:space:]]*['\"]?([^'\"+[:space:]]+).*/\1/")
          echo "tag=$tag  pubspec=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $pkg. Publishing now would ship a build whose About screen reports a different version. Bump pubspec and move the tag instead."
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: build

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/app-release.aab
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-release.apk
          cd dist
          sha256sum app-release.aab app-release.apk > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build release notes
        run: |
          set -euo pipefail
          if prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null); then
            changes=$(git log --no-merges --pretty='- %s (%h)' "${prev}..${GITHUB_REF_NAME}")
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${GITHUB_REF_NAME}"
          else
            changes="- Initial tagged release."
            compare="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          fi
          {
            echo "### What's Changed"
            echo "$changes"
            echo
            echo "**Full Changelog**: $compare"
            echo
            echo "### Supported Android Versions"
            echo "- Android 7.0 (API 24) and later."
            echo "- Built and tested on Android 14 (API 34) / Android 15 (API 36)."
            echo
            echo "### Known Limitations"
            echo "- Single-device, offline account (no server): creating a new account replaces the previous local credential."
            echo "- Backups are device-bound - the encryption key is not stored in the backup file, so a backup restores only on the device that created it."
            echo "- Encrypted backups are copied to the clipboard; any third-party storage is the user's choice and subject to that provider's policies."
            echo "- Release builds are signed with the project release key (`anya-release-key-v2`)."
            echo
            echo "### Checksums (sha256)"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > NOTES.md
          cat NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            dist/app-release.aab \
            dist/app-release.apk \
            dist/SHA256SUMS.txt
