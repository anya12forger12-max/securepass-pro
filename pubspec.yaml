name: securepass_pro
description: "Professional Privacy-First Password & Credential Generator"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Localization
  intl: any

  # Typography
  google_fonts: ^6.2.1

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  equatable: ^2.0.7
  logging: ^1.2.0
  url_launcher: ^6.3.1

  # Platform detection
  universal_platform: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  generate: true
