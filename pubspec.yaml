name: securepass_pro
description: "Professional Privacy-First Password & Credential Generator"
publish_to: 'none'
version: 2.2.32+36

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  # Unused deps removed in a dependency sweep: cupertino_icons, url_launcher,
  # equatable, collection, path_provider, google_fonts, universal_platform --
  # all verified as zero-import across lib/ and test/.
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  package_info_plus: ^9.0.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  shared_preferences: ^2.3.4

  # Localization
  intl: any

  # Typography

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.7.0

  # Secure Storage (Android Keystore / iOS Keychain backed)
  flutter_secure_storage: ^9.2.4
  logging: ^1.2.0

  # Platform detection
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  generate: true
